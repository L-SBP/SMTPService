# 基础服务器配置
server.port=8000

# 数据库配置（生产用MySQL）
spring.datasource.url=jdbc:mysql://localhost:3306/mailbox_prod?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:your_secure_password}  # 建议用环境变量

# 连接池配置（生产优化）
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA配置（生产模式：校验表结构，不显示SQL）
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT配置（生产用安全密钥，建议环境变量注入）
jwt.secret=${JWT_SECRET:your-production-secret-key-keep-safe}
jwt.expiration=86400000

# 跨域配置（仅允许生产前端域名）
cors.allowed-origins=https://your-frontend-domain.com

# 邮件服务器配置（生产用正式服务器）
# SMTP配置
smtp.server.host=smtp.mb.com
smtp.server.port=25
smtp.server.timeout=60
smtp.server.max-connections=100
smtp.server.max-message-size=10485760
# POP3配置
pop3.server.host=pop.mb.com
pop3.server.port=110
pop3.server.timeout=60
pop3.server.max-connections=50

# 邮件协议补充配置
mail.timeout=30000
mail.connection.timeout=10000
mail.read.timeout=30000
mail.debug=false  # 生产关闭调试

# 外发SMTP中继配置（生产建议用环境变量注入敏感信息）
outbound.smtp.enabled=${OUTBOUND_SMTP_ENABLED:false}
outbound.smtp.host=${OUTBOUND_SMTP_HOST:}
outbound.smtp.port=${OUTBOUND_SMTP_PORT:587}
outbound.smtp.ssl=${OUTBOUND_SMTP_SSL:false}
outbound.smtp.starttls=${OUTBOUND_SMTP_STARTTLS:true}
outbound.smtp.username=${OUTBOUND_SMTP_USERNAME:}
outbound.smtp.password=${OUTBOUND_SMTP_PASSWORD:}
outbound.smtp.from-override=${OUTBOUND_SMTP_FROM_OVERRIDE:}
# 超时设置
outbound.smtp.connection-timeout=30000
outbound.smtp.timeout=60000
outbound.smtp.write-timeout=60000
outbound.smtp.debug=false
outbound.smtp.default-display-name=Mailbox System

# 安全配置（生产加强）
security.enable-tls=true  # 生产开启TLS加密
security.enable-blacklist=true
security.enable-rate-limiting=true  # 生产开启限流
security.max-connections-per-ip=5  # 严格限制单IP连接

# 协议特性（生产关闭危险特性）
protocol.enable-vrfy=false  # 关闭VRFY防止用户枚举
protocol.enable-expn=false
protocol.enable-starttls=true
protocol.enable-apop=false
protocol.enable-dele=true
protocol.enable-rset=true
protocol.enable-top=true

# 错误处理（生产隐藏详细错误）
error.enable-detailed-responses=false  # 避免泄露系统信息
error.enable-queue-retry=true
error.max-retry-attempts=3
error.retry-delay=5000

# 日志配置（生产精简日志）
logging.config=classpath:logback-prod.xml
logging.enable-connection-logs=true
logging.enable-command-logs=false
logging.enable-performance-logs=false
logging.level.com.example.mailbox=INFO
logging.level.org.springframework.security=INFO

# 文件上传配置（生产严格限制）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# 附件存储配置（生产指定安全路径）
attachment.upload-dir=/var/uploads/attachments

# Redis配置（生产安全配置）
spring.data.redis.host=${REDIS_HOST:redis-server}  # 建议用环境变量指定地址
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}  # 生产建议设置密码
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
