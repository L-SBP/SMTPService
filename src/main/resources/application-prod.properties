# 生产环境配置
server.port=8080

# 数据库配置 - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/mailbox_prod?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=your_password

# JPA配置
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT配置
jwt.secret=${JWT_SECRET:your-production-secret-key}
jwt.expiration=86400000

# 跨域配置
cors.allowed-origins=https://your-frontend-domain.com

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# 日志配置
logging.level.com.example.mailbox=INFO
logging.level.org.springframework.security=INFO

# 附件存储路径
attachment.upload-dir=/var/uploads/attachments

# 缓存配置
spring.cache.type=redis
spring.redis.host=localhost
spring.redis.port=6379
