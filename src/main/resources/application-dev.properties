# H2控制台配置（开发调试用）
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# JPA配置（开发模式：自动创建表，显示SQL）
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 连接池配置（开发轻量配置）
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JWT配置（开发用测试密钥）
jwt.secret=ThisIsASecretKeyForDevelopmentOnly_123456
jwt.expiration=86400000

# ?????????????????? 5173?
cors.allowed-origins=http://localhost:8081,http://localhost:3000,http://localhost:8000,http://localhost:5173,http://localhost:5174

# 邮件服务器配置（开发用本地服务器）
# SMTP配置
smtp.server.host=0.0.0.0
smtp.server.port=2525
smtp.server.timeout=60
smtp.server.max-connections=50
smtp.server.max-message-size=10485760
# POP3配置
pop3.server.host=0.0.0.0
pop3.server.port=1100
pop3.server.timeout=60
pop3.server.max-connections=30

# 邮件协议补充配置
mail.timeout=30000
mail.connection.timeout=10000
mail.read.timeout=30000
mail.debug=true  # 开发开启调试模式

# 外发SMTP中继配置（把邮件发到QQ/Gmail等外部邮箱时使用）
# 建议使用“授权码/应用专用密码”，不要填登录密码
outbound.smtp.enabled=true
outbound.smtp.host=smtp.qq.com
outbound.smtp.port=587
outbound.smtp.ssl=false
outbound.smtp.starttls=true
outbound.smtp.username=1414246561@qq.com
outbound.smtp.password=mszsktsgqumyjfje
# 可选：强制覆盖 From（服务商要求 From=认证账号时开启）
outbound.smtp.from-override=1414246561@qq.com
# 超时设置（毫秒）
outbound.smtp.connection-timeout=30000
outbound.smtp.timeout=60000
outbound.smtp.write-timeout=60000
# 调试模式
outbound.smtp.debug=false
# 默认发件人显示名称
outbound.smtp.default-display-name=Mailbox System

# ====== 入站邮件配置（从中继账号拉取邮件） ======
# 启用后，系统会定时从中继邮箱拉取邮件并分发给系统用户
inbound.mail.enabled=true
# 协议：imap 或 pop3（推荐imap，支持搜索未读邮件）
inbound.mail.protocol=imap
# QQ邮箱IMAP服务器
inbound.mail.host=imap.qq.com
inbound.mail.port=993
inbound.mail.ssl=true
# 认证信息（与外发SMTP使用同一账号）
inbound.mail.username=1414246561@qq.com
inbound.mail.password=mszsktsgqumyjfje
# 拉取间隔（秒）
inbound.mail.fetch-interval=60
# 每次拉取的最大邮件数
inbound.mail.max-fetch-count=50
# 拉取后是否删除远程邮件（建议false，保留备份）
inbound.mail.delete-after-fetch=false
# 拉取后是否标记为已读
inbound.mail.mark-as-read-after-fetch=true
# 系统邮件域名（用于识别目标用户）
inbound.mail.system-domain=mb.com
# 默认收件人（当无法识别目标用户时，留空则丢弃）
inbound.mail.default-recipient=Teptao@mb.com

# ====== 常用邮箱SMTP配置参考 ======
# QQ邮箱:
#   host=smtp.qq.com, port=587(STARTTLS) 或 465(SSL)
#   需要开启SMTP服务并获取授权码: https://service.mail.qq.com/cgi-bin/help?subtype=1&&id=28&&no=1001256
#
# 163邮箱:
#   host=smtp.163.com, port=465(SSL) 或 25
#   需要开启SMTP服务并设置授权码
#
# Gmail:
#   host=smtp.gmail.com, port=587(STARTTLS) 或 465(SSL)
#   需要开启"允许不够安全的应用"或使用应用专用密码
#
# Outlook/Hotmail:
#   host=smtp.office365.com, port=587(STARTTLS)
#   使用账号密码登录

# 安全配置（开发简化）
security.enable-tls=false
security.enable-blacklist=true
security.enable-rate-limiting=false
security.max-connections-per-ip=10  # 开发放宽限制

# 协议特性（开发全开便于测试）
protocol.enable-vrfy=true
protocol.enable-expn=true
protocol.enable-starttls=true
protocol.enable-apop=false
protocol.enable-dele=true
protocol.enable-rset=true
protocol.enable-top=true

# 错误处理（开发显示详细错误）
error.enable-detailed-responses=true
error.enable-queue-retry=true
error.max-retry-attempts=2
error.retry-delay=3000

# 日志配置（开发详细日志）
logging.config=classpath:logback-dev.xml
logging.enable-connection-logs=true
logging.enable-command-logs=true
logging.enable-performance-logs=true
logging.level.com.example.mailbox=DEBUG
logging.level.org.springframework.security=INFO

# 文件上传配置（开发宽松限制）
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# Redis配置（开发用本地Redis）
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
