# 基础服务器配置
server.port=8000

# 数据库配置
 spring.datasource.url=jdbc:mysql://localhost:3306/mailbox_prod?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8
 spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 spring.datasource.username=root
 spring.datasource.password=root_secure_password_123

#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.datasource.initialization-mode=always
#spring.datasource.schema=classpath:import.sql

# H2控制台配置（开发调试用）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA配置（开发模式：自动创建表，显示SQL）
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 连接池配置（开发轻量配置）
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JWT配置（开发用测试密钥）
jwt.secret=ThisIsASecretKeyForDevelopmentOnly_123456
jwt.expiration=86400000

# 跨域配置（允许本地前端调试地址）
cors.allowed-origins=http://localhost:8081,http://localhost:3000,http://localhost:8000

# 邮件服务器配置（开发用本地服务器）
# SMTP配置
smtp.server.host=0.0.0.0
smtp.server.port=25
smtp.server.timeout=60
smtp.server.max-connections=50
smtp.server.max-message-size=10485760
# POP3配置
pop3.server.host=0.0.0.0
pop3.server.port=110
pop3.server.timeout=60
pop3.server.max-connections=30

# 邮件协议补充配置
mail.timeout=30000
mail.connection.timeout=10000
mail.read.timeout=30000
mail.debug=true  # 开发开启调试模式

# 安全配置（开发简化）
security.enable-tls=false
security.enable-blacklist=true
security.enable-rate-limiting=false
security.max-connections-per-ip=10  # 开发放宽限制

# 协议特性（开发全开便于测试）
protocol.enable-vrfy=true
protocol.enable-expn=true
protocol.enable-starttls=true
protocol.enable-apop=false
protocol.enable-dele=true
protocol.enable-rset=true
protocol.enable-top=true

# 错误处理（开发显示详细错误）
error.enable-detailed-responses=true
error.enable-queue-retry=true
error.max-retry-attempts=2
error.retry-delay=3000

# 日志配置（开发详细日志）
logging.config=classpath:logback-dev.xml
logging.enable-connection-logs=true
logging.enable-command-logs=true
logging.enable-performance-logs=true
logging.level.com.example.mailbox=DEBUG
logging.level.org.springframework.security=INFO

# 文件上传配置（开发宽松限制）
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# Redis配置（开发用本地Redis）
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
