version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mailbox-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_password_123
      - MYSQL_DATABASE=mailbox_prod
      - MYSQL_USER=mailbox_user
      - MYSQL_PASSWORD=secure_password_123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mailbox_user", "--password=secure_password_123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0
    container_name: mailbox-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data: