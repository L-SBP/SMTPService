# 基础服务器配置
server.port=8000

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/mailbox_prod?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=mailbox_user
spring.datasource.password=secure_password_123

#spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
