# 邮件协议配置
# 课程作业：自定义邮箱服务器配置

# 自定义邮箱服务器配置
# 所有@mb.com邮箱使用统一的服务器
pop3.server.host=pop.mb.com
pop3.server.port=110
pop3.server.ssl=false

smtp.server.host=smtp.mb.com
smtp.server.port=25
smtp.server.ssl=false

# 邮件协议超时配置（毫秒）
mail.timeout=30000
mail.connection.timeout=10000
mail.read.timeout=30000

# 邮件协议调试模式
mail.debug=false
