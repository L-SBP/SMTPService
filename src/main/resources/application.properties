# 服务器配置
server.port=8000

# 数据库配置
# 使用MySQL数据库连接docker容器
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/mailbox_prod?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root_secure_password_123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 连接池配置
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JWT配置
jwt.secret=ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ123456
jwt.expiration=86400000

# 跨域配置
cors.allowed-origins=http://localhost:8081,http://localhost:3000,http://localhost:8080,http://localhost:8000
